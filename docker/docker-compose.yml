# Jalankan sekali jalan dari root repo (sudah termasuk DB + semua service):
#   bash scripts/docker-up.sh
# Manual, setara dengan script itu:
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --build
name: bakulan-wa

x-app-env: &app-env
  DATABASE_URL: postgresql://bakulan:${POSTGRES_PASSWORD}@postgres:5432/bakulan_wa?schema=public
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bakulan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bakulan_wa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakulan -d bakulan_wa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: antrean BullMQ, refresh token, dan kunci handover bertahan saat restart.
    # noeviction: wajib untuk BullMQ (jangan sampai key antrean terhapus karena memori penuh).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    # Port ini dipetakan supaya browser bisa langsung memanggil API di
    # http://localhost:3001 saat test lokal. Untuk produksi lewat domain,
    # Caddy di bawah tetap menjadi pintu masuknya.
    ports:
      - "3001:3001"
    env_file: ../.env
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  wa-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.wa-worker
    restart: unless-stopped
    env_file: ../.env
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Beri waktu shutdown rapi: menyimpan auth state semua sesi sebelum proses mati.
    stop_grace_period: 30s

  ai-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai-worker
    restart: unless-stopped
    env_file: ../.env
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 60s # job AI yang sedang jalan boleh selesai dulu

  web:
    # Dashboard PWA (apps/web, Next.js). NEXT_PUBLIC_API_URL dibaca saat
    # build, jadi nilainya harus URL API yang bisa diakses browser, BUKAN
    # hostname internal Docker (api:3001 tidak bisa dibuka browser).
    # Lokal: http://localhost:3001 (default).
    # Codespaces: URL forward port 3001, mis. https://<nama>-3001.app.github.dev
    #   (atur lewat WEB_PUBLIC_API_URL di .env, dan masukkan URL web-nya
    #   ke WEB_ORIGIN backend supaya tidak kena CORS).
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${WEB_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${WEB_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
